name: Build Persian APK
on: { push: { branches: [ main ] }, workflow_dispatch: }
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: android-actions/setup-android@v3
   - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.7' }
   - run: gradle --no-daemon :app:assembleRelease
   - run: mkdir -p artifacts && cp app/build/outputs/apk/release/app-release.apk artifacts/MngStore-Ref-Full-Zero-fa-v1.0.apk
   - uses: actions/upload-artifact@v4
     with: { name: MngStore-Ref-Full-Zero-fa-v1.0, path: artifacts/MngStore-Ref-Full-Zero-fa-v1.0.apk }
